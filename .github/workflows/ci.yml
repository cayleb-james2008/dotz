name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p dotz-core --all-targets -- -D warnings
      - run: cargo test -p dotz-core
      # Cold-start perf gate (Windows-only): fetches the bundled ONNX model, then runs the
      # Embedder::load() bench against the committed baseline (docs/perf-baseline.json, 526ms
      # on 2026-07-20). A regression beyond 15% fails the gate. The bench step is guarded so a
      # fresh checkout without the model stays green — `npm run fetch-model` is run first.
      - run: npm install && npm run fetch-model
        if: matrix.os == 'windows-latest'
      - run: cargo bench --bench cold_start -- --bench
        if: matrix.os == 'windows-latest'

# ponytail: src-tauri/icons/icon.icns is a placeholder (byte-copy of icon.png). Generate a real
# .icns via `iconutil -c icns icon.iconset/` on a macOS host before the first `cargo tauri build`
# that targets `dmg`. Tauri warns on a malformed .icns but does not fail the build; the macOS
# build is not exercised on this host (see tauri.conf.json `targets: [nsis, dmg, appimage, deb]`).
# The seatbelt (macOS sandbox-exec) and bwrap (Linux bubblewrap) argv in dotz-core/src/sandbox.rs
# are also deferred — see the `# ponytail:` TODOs in MacSandbox/LinuxSandbox::prepare_command.