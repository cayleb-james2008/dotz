appId: dev.dotz.app
productName: dotz
directories:
  output: release
# asar:false ships plain files so pi's jiti .ts-extension loading and native deps work unchanged.
asar: false
extraMetadata:
  main: dist/main.js
files:
  - dist/**/*
  - web/**/*
  - .pi/**/*
  - assets/**/*
  - package.json
  - node_modules/**/*
win:
  icon: assets/dotz.ico
  artifactName: dotz.exe
  target:
    - portable
# Source-rebuild updates keep the portable exe as the only Windows release artifact.
publish:
  provider: github
  owner: cayleb-james2008
  repo: dotz
