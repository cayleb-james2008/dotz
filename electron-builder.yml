appId: dev.dotz.app
productName: dotz
directories:
  output: release
# asar:false ships plain files so pi's jiti .ts-extension loading and native deps work unchanged.
asar: false
extraMetadata:
  main: dist/main.js
files:
  - dist/**/*
  - web/**/*
  - .pi/**/*
  - package.json
  - node_modules/**/*
win:
  target: portable
# Update feed for electron-updater. Override at build/publish time or via DOTZ_UPDATE_URL env.
publish:
  provider: generic
  url: https://dotz-releases.example.com
# icon: assets/dotz.ico
