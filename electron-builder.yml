appId: dev.dotz.app
productName: dotz
directories:
  output: release
# asar:false ships plain files so pi's jiti .ts-extension loading and native deps work unchanged.
asar: false
extraMetadata:
  main: dist/main.js
files:
  - dist/**/*
  - web/**/*
  - .pi/**/*
  - package.json
  - node_modules/**/*
win:
  target:
    - nsis
    - portable
# NSIS updates through GitHub Releases; portable builds remain manual-download artifacts.
publish:
  provider: github
  owner: cayleb-james2008
  repo: dotz
# icon: assets/dotz.ico
