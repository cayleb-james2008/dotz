[package]
name = "dotz-tauri"
version = "0.2.8"
edition = "2024"
description = "dotz — ultra code (Rust/Tauri shell)"
default-run = "dotz"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# winres: Windows resource compiler — embeds the app icon, version info, and manifest
# into the .exe at build time for a professional installer appearance.
winres = "0.1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
dotz-core = { path = "../dotz-core" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[[bin]]
name = "dotz"
path = "src/main.rs"
