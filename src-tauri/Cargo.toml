[package]
name = "dotz-tauri"
version = "0.2.0"
edition = "2021"
description = "dotz — ultra code (Rust/Tauri shell)"
default-run = "dotz-tauri"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
dotz-core = { path = "../dotz-core" }
serde_json = "1"

[[bin]]
name = "dotz-tauri"
path = "src/main.rs"
